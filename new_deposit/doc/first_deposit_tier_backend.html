<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奖励配置后台示意图</title>
<style>
:root{
  --bg:#ffffff; --text:#303133; --sub:#606266; --muted:#909399;
  --line:#EBEEF5; --head:#F5F7FA; --input-bg:#ffffff; --input-bd:#DCDFE6;
  --primary:#409EFF; --new-bg:#FFF6F6; --new-text:#F56C6C;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#1d1e20; --text:#E5EAF3; --sub:#CFD3DC; --muted:#8D9095;
    --line:#2f3034; --head:#26272b; --input-bg:#141414; --input-bd:#4C4D4F;
    --primary:#409EFF; --new-bg:#2b1d1d; --new-text:#F89898;
  }
}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;font-size:18px}
.wrap{max-width:1320px;margin:0 auto;overflow-x:auto}
.inner{min-width:1260px}
h2{display:flex;align-items:center;gap:8px;font-size:24px;margin:0 0 14px}
.ex{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:110px 290px 150px 130px 150px 1fr;gap:12px;align-items:center;white-space:nowrap}
.hdr{font-size:16px;font-weight:600;color:var(--sub);background:var(--head);border-radius:4px;padding:10px 10px;letter-spacing:.5px}
.sec{padding:12px 0 8px;border-bottom:1px solid var(--line)}
.title{display:flex;justify-content:space-between;align-items:center;margin:0 10px 6px;min-height:32px}
.title label{display:flex;align-items:center;gap:8px;font-weight:500;font-size:18px;color:var(--text);cursor:pointer}
.title input:checked + span{color:var(--primary)}
.extra{display:flex;align-items:center;gap:8px;color:var(--sub)}
.row{padding:6px 10px;border-radius:4px}
.row.new{background:var(--new-bg)}
.tier{color:var(--sub)}
.tag{font-size:14px;color:var(--new-text);margin-left:6px}
.lbl{display:inline-block;width:130px;color:var(--sub)}
.field{display:inline-flex;align-items:center;height:38px;border:1px solid var(--input-bd);border-radius:4px;
  background:var(--input-bg);padding:0 10px}
.field input{border:none;outline:none;background:transparent;color:var(--text);font:inherit;width:100%}
.field .unit{color:var(--muted);font-size:14px;margin-left:6px;white-space:nowrap}
.field:focus-within{border-color:var(--primary)}
select{height:38px;width:130px;border:1px solid var(--input-bd);border-radius:4px;background:var(--input-bg);
  color:var(--text);font:inherit;padding:0 8px}
.flow{display:flex;align-items:center;gap:6px}
.flow label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.flow input:checked + span{color:var(--primary)}
.ghost{visibility:hidden}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:1px solid var(--input-bd);border-radius:3px;background:var(--input-bg);position:relative;cursor:pointer;flex:none}
input[type=checkbox]:checked{background:var(--primary);border-color:var(--primary)}
input[type=checkbox]:checked::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
input[type=checkbox]:disabled{opacity:.6;cursor:not-allowed}
.sec.off{opacity:.45}
.sec.off *{cursor:not-allowed}
.hint{font-size:16px;color:var(--muted);margin:10px 2px 0}
.err{display:none;font-size:14px;color:var(--new-text);margin-left:6px}
.bad .err{display:inline}
.bad .min2wrap{border-color:var(--new-text)}
</style>
</head>
<body>
<div class="wrap"><div class="inner">
  <h2><span class="ex">!</span>奖励配置</h2>

  <div class="grid hdr">
    <span>阶梯</span><span>领取条件</span><span>奖励选择</span><span>奖励比例</span><span>上限金额</span><span>奖金所需流水</span>
  </div>

  <!-- 新用户限时首充 -->
  <div class="sec" data-group="limited" data-tier>
    <div class="title">
      <label><input type="checkbox" class="main"><span>新用户限时首充奖励配置</span></label>
    </div>
    <div class="grid row timerow">
      <span class="tier"></span>
      <span><span class="lbl">奖励限时时效</span><span class="field" style="width:140px"><input value="120"><span class="unit">分钟</span></span></span>
    </div>
    <div class="grid row">
      <span class="tier">阶梯 1</span>
      <span><span class="lbl">最低充值金额</span><span class="field" style="width:140px"><input class="min1" value="0"></span></span>
      <select><option>彩金</option></select>
      <span class="field" style="width:100px"><input value="50"><span class="unit">%</span></span>
      <span class="field" style="width:130px"><input value="1000"></span>
      <span class="flow"><label><input type="checkbox"><span>本金</span></label><label><input type="checkbox"><span>奖金</span></label>
        <span class="field" style="width:90px"><input value=""><span class="unit">倍</span></span></span>
    </div>
    <div class="grid row new">
      <span class="tier">阶梯 2<span class="tag">新增</span></span>
      <span><span class="lbl">最低充值金额</span><span class="field min2wrap" style="width:140px"><input class="min2" value=""></span><span class="err">须大于阶梯 1</span></span>
      <select><option>彩金</option></select>
      <span class="field" style="width:100px"><input value=""><span class="unit">%</span></span>
      <span class="field" style="width:130px"><input value=""></span>
      <span class="flow"><label><input type="checkbox"><span>本金</span></label><label><input type="checkbox"><span>奖金</span></label>
        <span class="field" style="width:90px"><input value=""><span class="unit">倍</span></span></span>
    </div>
  </div>

  <!-- 新用户限时次日 -->
  <div class="sec" data-group="limited">
    <div class="title"><label><input type="checkbox" class="main"><span>新用户限时次日奖励配置</span></label></div>
    <div class="grid row">
      <span class="tier">—</span>
      <span><span class="lbl">有效投注</span><span class="field" style="width:140px"><input value="100"></span></span>
      <select><option>彩金</option></select>
      <span class="field" style="width:100px"><input value="36"><span class="unit">%</span></span>
      <span class="field" style="width:130px"><input value="550"></span>
      <span class="flow"><label class="ghost"><input type="checkbox"><span>本金</span></label><label class="ghost"><input type="checkbox"><span>奖金</span></label>
        <span class="field" style="width:90px"><input value="45"><span class="unit">倍</span></span></span>
    </div>
  </div>

  <!-- 新用户普通首充 -->
  <div class="sec" data-group="normal" data-tier>
    <div class="title"><label><input type="checkbox" class="main" checked><span>新用户普通首充奖励配置</span></label></div>
    <div class="grid row">
      <span class="tier">阶梯 1</span>
      <span><span class="lbl">最低充值金额</span><span class="field" style="width:140px"><input class="min1" value="100"></span></span>
      <select><option>彩金</option></select>
      <span class="field" style="width:100px"><input value="100"><span class="unit">%</span></span>
      <span class="field" style="width:130px"><input value="1000"></span>
      <span class="flow"><label><input type="checkbox" checked><span>本金</span></label><label><input type="checkbox" checked><span>奖金</span></label>
        <span class="field" style="width:90px"><input value="5"><span class="unit">倍</span></span></span>
    </div>
    <div class="grid row new">
      <span class="tier">阶梯 2<span class="tag">新增</span></span>
      <span><span class="lbl">最低充值金额</span><span class="field min2wrap" style="width:140px"><input class="min2" value="5000"></span><span class="err">须大于阶梯 1</span></span>
      <select><option>彩金</option></select>
      <span class="field" style="width:110px"><input value="120"><span class="unit">%</span></span>
      <span class="field" style="width:130px"><input value="60000"></span>
      <span class="flow"><label><input type="checkbox" checked><span>本金</span></label><label><input type="checkbox" checked><span>奖金</span></label>
        <span class="field" style="width:90px"><input value="5"><span class="unit">倍</span></span></span>
    </div>
  </div>

  <!-- 新用户普通次日 -->
  <div class="sec" data-group="normal">
    <div class="title"><label><input type="checkbox" class="main"><span>新用户普通次日奖励配置</span></label></div>
    <div class="grid row">
      <span class="tier">—</span>
      <span><span class="lbl">有效投注</span><span class="field" style="width:140px"><input value="500"></span></span>
      <select><option>彩金</option></select>
      <span class="field" style="width:100px"><input value="10"><span class="unit">%</span></span>
      <span class="field" style="width:130px"><input value="5000"></span>
      <span class="flow"><label class="ghost"><input type="checkbox"><span>本金</span></label><label class="ghost"><input type="checkbox"><span>奖金</span></label>
        <span class="field" style="width:90px"><input value="1"><span class="unit">倍</span></span></span>
    </div>
  </div>
  <div class="hint">防呆：限时首充与普通首充择一、限时次日与普通次日择一，勾选其中一项时另一项反灰不可编辑；阶梯 2 最低充值金额须大于阶梯 1。</div>
</div></div>
<script>
const secs=[...document.querySelectorAll('.sec')];
function sync(){
  const pair=s=>s.hasAttribute('data-tier')?'first':'next';
  secs.forEach(s=>{
    const off=secs.some(o=>o!==s&&pair(o)===pair(s)&&o.querySelector('.main').checked);
    s.classList.toggle('off',off);
    s.querySelectorAll('input,select').forEach(el=>el.disabled=off);
  });
}
function check(s){
  const a=s.querySelector('.min1'),b=s.querySelector('.min2');
  if(!a||!b)return;
  const row=b.closest('.row');
  const bad=b.value!==''&&Number(b.value)<=Number(a.value||0);
  row.classList.toggle('bad',bad);
}
secs.forEach(s=>{
  s.querySelector('.main').addEventListener('change',sync);
  s.querySelectorAll('.min1,.min2').forEach(i=>i.addEventListener('input',()=>check(s)));
  check(s);
});
sync();
</script>
</body>
</html>
