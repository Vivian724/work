<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 通用奖励图示：一键领取（多种奖励一起领）时使用，不代表单一奖励类型 -->
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a5b"/><stop offset="1" stop-color="#e2453a"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa06e"/><stop offset="1" stop-color="#f05a40"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#ffc63d"/><stop offset="1" stop-color="#f3a51c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".95"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="62" r="56" fill="url(#glow)"/>
  <!-- 蝴蝶结 -->
  <path d="M60 38 C46 18 26 24 34 36 C38 42 50 40 60 38Z" fill="url(#rib)" stroke="#e39417" stroke-width="1.5"/>
  <path d="M60 38 C74 18 94 24 86 36 C82 42 70 40 60 38Z" fill="url(#rib)" stroke="#e39417" stroke-width="1.5"/>
  <!-- 盒身 -->
  <rect x="24" y="56" width="72" height="50" rx="7" fill="url(#box)"/>
  <rect x="24" y="56" width="72" height="10" fill="#c9382f" opacity=".35"/>
  <!-- 盒盖 -->
  <rect x="18" y="38" width="84" height="20" rx="6" fill="url(#lid)"/>
  <rect x="22" y="41" width="76" height="5" rx="2.5" fill="#fff" opacity=".35"/>
  <!-- 缎带 -->
  <rect x="52" y="38" width="16" height="68" fill="url(#rib)"/>
  <rect x="55" y="38" width="4" height="68" fill="#fff" opacity=".45"/>
  <circle cx="60" cy="38" r="6.5" fill="#ffc63d" stroke="#e39417" stroke-width="1.5"/>
  <!-- 星光 -->
  <path d="M100 18 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5Z" fill="#ffd34d"/>
  <path d="M16 70 l1.8 4.2 4.2 1.8 -4.2 1.8 -1.8 4.2 -1.8 -4.2 -4.2 -1.8 4.2 -1.8Z" fill="#ffd34d"/>
</svg>
